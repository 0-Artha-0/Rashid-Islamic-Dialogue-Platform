name: Validate retrieval fix
on:
  push:
    branches:
      - fix/evidence-retrieval-quality
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          GEMINI_API_KEY: test-placeholder
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
